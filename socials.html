<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MakkoDakko | Socials</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Roboto, sans-serif;

            min-height: 100vh;

            background:
                radial-gradient(circle at top left, #1e3a8a, transparent 35%),
                radial-gradient(circle at bottom right, #7e22ce, transparent 35%),
                linear-gradient(135deg, #020617, #0f172a);

            color: white;

            display: flex;
            flex-direction: column;
        }


        /* Main container */

        .container {
            width: min(900px, 90%);
            margin: auto;
            padding: 40px 0;
        }


        /* Back button */

        .back-button {
            display: inline-flex;

            align-items: center;
            gap: 8px;

            padding: 10px 18px;

            color: #cbd5e1;
            text-decoration: none;

            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;

            background: rgba(255,255,255,0.06);

            transition: 0.25s;
        }

        .back-button:hover {
            background: rgba(255,255,255,0.14);
            color: white;

            transform: translateX(-4px);
        }


        /* Header */

        .header {
            text-align: center;

            padding: 60px 20px 40px;
        }

        .header .icon {
            width: 80px;
            height: 80px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: linear-gradient(135deg, #38bdf8, #8b5cf6);

            font-size: 35px;

            box-shadow:
                0 10px 40px rgba(56,189,248,0.25);
        }

        .header h1 {
            font-size: clamp(2.2rem, 6vw, 3.5rem);

            margin-bottom: 12px;

            background: linear-gradient(
                90deg,
                #38bdf8,
                #a855f7
            );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .header p {
            color: #94a3b8;
            font-size: 1.05rem;
        }


        /* Social cards */

        .socials {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));

            gap: 20px;
        }


        .social-card {

            position: relative;

            display: flex;
            align-items: center;

            gap: 20px;

            padding: 25px;

            text-decoration: none;
            color: white;

            background: rgba(255,255,255,0.07);

            border: 1px solid rgba(255,255,255,0.1);

            border-radius: 18px;

            backdrop-filter: blur(12px);

            overflow: hidden;

            transition:
                transform 0.3s,
                background 0.3s,
                box-shadow 0.3s;
        }


        .social-card:hover {

            transform: translateY(-7px);

            background: rgba(255,255,255,0.13);

            box-shadow:
                0 15px 40px rgba(0,0,0,0.35);
        }


        .social-icon {

            min-width: 60px;
            height: 60px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;

            font-size: 30px;

            background: rgba(255,255,255,0.1);
        }


        .social-info {
            flex: 1;
        }


        .social-info h2 {
            font-size: 1.25rem;
            margin-bottom: 6px;
        }


        .social-info p {
            color: #94a3b8;
            font-size: 0.9rem;
        }


        .arrow {
            color: #64748b;
            font-size: 18px;

            transition: 0.25s;
        }


        .social-card:hover .arrow {
            color: white;
            transform: translateX(5px);
        }


        /* Individual platforms */

        .youtube .social-icon {
            color: #ff0000;
        }

        .facebook .social-icon {
            color: #1877f2;
        }

        .instagram .social-icon {
            color: #e1306c;
        }


        /* Footer */

        footer {

            margin-top: auto;

            padding: 30px 20px;

            text-align: center;

            color: #64748b;

            font-size: 0.85rem;

            border-top:
                1px solid rgba(255,255,255,0.08);
        }


        footer strong {
            color: #cbd5e1;
        }


        /* Mobile */

        @media (max-width: 600px) {

            .container {
                padding-top: 25px;
            }

            .header {
                padding-top: 45px;
            }

            .socials {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- Back -->

    <a
        href="/makko/index.html"
        class="back-button"
    >
        <i class="fa-solid fa-arrow-left"></i>
        Trở về trang chủ
    </a>


    <!-- Header -->

    <header class="header">

        <div class="icon">
            <i class="fa-solid fa-share-nodes"></i>
        </div>

        <h1>My Social Accounts</h1>

        <p>
            Find me around the internet
        </p>

    </header>


    <!-- Social links -->

    <main class="socials">


        <!-- YouTube -->

        <a
            class="social-card youtube"
            href="https://youtube.com/c/MinhKhanhDo"
            target="_blank"
            rel="noopener noreferrer"
        >

            <div class="social-icon">
                <i class="fa-brands fa-youtube"></i>
            </div>

            <div class="social-info">

                <h2>YouTube</h2>

                <p>
                    Sports cards, FPL and more
                </p>

            </div>

            <div class="arrow">
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </div>

        </a>


        <!-- Facebook -->

        <a
            class="social-card facebook"
            href="https://facebook.com/makkodakkose7en"
            target="_blank"
            rel="noopener noreferrer"
        >

            <div class="social-icon">
                <i class="fa-brands fa-facebook-f"></i>
            </div>

            <div class="social-info">

                <h2>Facebook</h2>

                <p>
                    Follow my personal updates
                </p>

            </div>

            <div class="arrow">
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </div>

        </a>


        <!-- Instagram -->

        <a
            class="social-card instagram"
            href="https://www.instagram.com/makkodakkose7en/"
            target="_blank"
            rel="noopener noreferrer"
        >

            <div class="social-icon">
                <i class="fa-brands fa-instagram"></i>
            </div>

            <div class="social-info">

                <h2>Instagram</h2>

                <p>
                    Photos, stories and updates
                </p>

            </div>

            <div class="arrow">
                <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </div>

        </a>


    </main>


</div>


<!-- Footer -->

<footer>

    <p>
        Website created by
        <strong>Đỗ Minh Khánh</strong>
    </p>

    <p>
        THPT Lê Quý Đôn - Thành phố Hồ Chí Minh
        <br>
        2022 - 2025
    </p>

</footer>


</body>

</html>
